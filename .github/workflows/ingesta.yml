name: Ingesta de datos reales

# Lee los catálogos públicos de las tiendas Shopify que hayas añadido y las
# tendencias del día de Google Trends. Sin claves de API: solo se necesita el
# CRON_SECRET de tu propio servidor.
#
# La ejecución automática ya la hace Vercel Cron (ver `vercel.json`, una vez
# al día: el plan gratuito de Vercel no permite más frecuencia). Este flujo
# se deja solo para lanzarlo a mano desde la pestaña «Actions» cuando se
# quiera forzar una lectura inmediata sin esperar al cron de Vercel.
#
# Para usar el botón manual, añade en el repositorio (Settings → Secrets and
# variables → Actions) las variables APP_URL y CRON_SECRET.
on:
  workflow_dispatch:

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - name: Leer tiendas y tendencias
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/ingesta" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"geo": "ES", "tendencias": true, "maxTiendas": 8}' \
            --max-time 600
